{% extends "base.html" %}
{% block body %}
<div class="card" style="max-width:420px;margin:0 auto">
  <h2>Masuk sebagai Administrator</h2>
  <p class="muted">Halaman ini hanya untuk petugas PUKP-3.
     Pengunjung umum tidak perlu masuk &mdash;
     gunakan <a href="{{ url_for('cek') }}">Cek Data Peserta</a>.</p>
  {% if error %}<p class="err" style="margin-top:12px">{{ error }}</p>{% endif %}
  <form method="post" style="margin-top:16px">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ request.args.get('next','') }}">
    <p><label>Username<br>
      <input name="user" style="width:100%" autofocus autocomplete="username"></label></p>
    <p><label>Password<br>
      <input name="pw" type="password" style="width:100%"
             autocomplete="current-password"></label></p>
    <button style="width:100%">Masuk</button>
  </form>
</div>
{% endblock %}
